
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rutuja Thakare | Communication Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Space+Grotesk', sans-serif;
        overflow-x: hidden;
      }
      .font-serif { font-family: 'Playfair Display', serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      
      /* Hide default cursor globally */
      * {
        cursor: none !important;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-15px) rotate(3deg); }
      }
      
      @keyframes float-slow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes reveal-up {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes loading-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      @keyframes glitter {
        0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
      }

      @keyframes sparkle-burst {
        0% { transform: scale(0); opacity: 0; }
        50% { transform: scale(1.5); opacity: 1; }
        100% { transform: scale(1.2); opacity: 0.8; }
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      
      .animate-float-slow {
        animation: float-slow 4s ease-in-out infinite;
      }

      .animate-spin-slow {
        animation: spin-slow 12s linear infinite;
      }

      .animate-loading-bar {
        animation: loading-bar 2.5s ease-in-out infinite;
      }

      .animate-glitter {
        animation: glitter 3s ease-in-out infinite;
      }

      .animate-sparkle-burst {
        animation: sparkle-burst 2s ease-in-out infinite;
      }

      .reveal {
        opacity: 0;
        transform: translateY(60px);
        transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .reveal-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .collage-shadow {
        box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
      }
      .dark .collage-shadow {
        box-shadow: 8px 8px 0px 0px rgba(255,255,255,0.15);
      }
      .collage-shadow-sm {
        box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
      }
      .dark .collage-shadow-sm {
        box-shadow: 4px 4px 0px 0px rgba(255,255,255,0.1);
      }
      html {
        scroll-behavior: smooth;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #ec4899;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #be185d;
      }
    </style>
